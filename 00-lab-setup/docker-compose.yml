# Confluent crash course — local lab: two single-node KRaft clusters (dc-a, dc-b)
#
# Written 2026-11-07 against Confluent Platform 8.4.0 (Apache Kafka 4.4), image tags
# published on Docker Hub 2026-10-26. All five containers started and healthy on 2026-11-08.
# Read 00-lab-setup/README.md first.
#
# What runs:
#   dc-a  Confluent Server 8.4.0, KRaft combined mode (broker+controller), "data centre A"
#   sr-a  Schema Registry 8.4.0 for dc-a (exporter + data-contract rule extensions on)
#   dc-b  Confluent Server 8.4.0, KRaft combined mode, "data centre B"
#   sr-b  Schema Registry 8.4.0 for dc-b
#   connect  (profile "mm2" only) Kafka Connect worker on dc-b, for the MirrorMaker 2 comparison
#   control-center, prometheus, alertmanager  (profile "c3" only) Control Center 2.7 web UI for
#            both clusters, for visualisation. Optional; no lab depends on it.
#
# Licence: no KAFKA_CONFLUENT_LICENSE is set. Confluent's licence page says single-broker
# clusters run under the free *developer licence* (no expiry, non-production, multiple
# single-broker clusters share it). The Docker config page says "without the license key,
# Confluent Server can be used for a 30-day trial period". Both clusters here are single-broker.
# Adding a second broker to a cluster switches it to the 30-day trial and you cannot go back. [V]
#
# KRaft combined mode is for local experiments only; Confluent does not support it in production.
#
# Host ports:
#   dc-a  Kafka localhost:9092   embedded REST v3 localhost:8090   SR localhost:8081
#   dc-b  Kafka localhost:9093   embedded REST v3 localhost:8091   SR localhost:8082
#   connect REST localhost:8083 (profile mm2)
#   Control Center http://localhost:9021 (profile c3)
# Inside the Docker network use dc-a:29092 / dc-b:29092 / sr-a:8081 / sr-b:8081.
#
# Start:   docker compose up -d                  (both clusters)
#          docker compose --profile mm2 up -d    (plus the Connect worker for MM2)
#          docker compose --profile mm2 --profile c3 up -d   (plus Control Center)
# Stop:    docker compose stop                   (keeps data)
# Reset:   docker compose --profile mm2 --profile c3 down -v  (deletes all data)

name: crash-course

# To change the CP version, change all four image tags together (cp-server, cp-schema-registry x2,
# cp-kafka-connect). Fallback if 8.4.0 misbehaves: 8.3.x. Control Center has its own version line
# (2.x); 2.7.0 is the one Confluent's cp-all-in-one pairs with CP 8.4.0.

# Broker telemetry for Control Center 2.x: each broker pushes metrics (OTLP over HTTP) to the
# Prometheus that ships with Control Center. Copied from confluentinc/cp-all-in-one, branch
# 8.4.0-post. Merged into both brokers below. Without the c3 profile running, the exporter cannot
# reach prometheus:9090 and logs "ERROR Confluent Telemetry Metrics Failure" with a stack trace
# about once a minute. Harmless; the brokers work normally.
x-c3-telemetry: &c3-telemetry
  KAFKA_METRIC_REPORTERS: "io.confluent.telemetry.reporter.TelemetryReporter"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_TYPE: "http"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_ENABLED: "true"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_METRICS_INCLUDE: "io.confluent.kafka.server.request.(?!.*delta).*|io.confluent.kafka.server.server.broker.state|io.confluent.kafka.server.replica.manager.leader.count|io.confluent.kafka.server.request.queue.size|io.confluent.kafka.server.broker.topic.failed.produce.requests.rate.1.min|io.confluent.kafka.server.tier.archiver.total.lag|io.confluent.kafka.server.request.total.time.ms.p99|io.confluent.kafka.server.broker.topic.failed.fetch.requests.rate.1.min|io.confluent.kafka.server.broker.topic.total.fetch.requests.rate.1.min|io.confluent.kafka.server.partition.caught.up.replicas.count|io.confluent.kafka.server.partition.observer.replicas.count|io.confluent.kafka.server.tier.tasks.num.partitions.in.error|io.confluent.kafka.server.broker.topic.bytes.out.rate.1.min|io.confluent.kafka.server.request.total.time.ms.p95|io.confluent.kafka.server.controller.active.controller.count|io.confluent.kafka.server.request.total.time.ms.p999|io.confluent.kafka.server.controller.active.broker.count|io.confluent.kafka.server.request.handler.pool.request.handler.avg.idle.percent.rate.1.min|io.confluent.kafka.server.controller.unclean.leader.elections.rate.1.min|io.confluent.kafka.server.replica.manager.partition.count|io.confluent.kafka.server.controller.unclean.leader.elections.total|io.confluent.kafka.server.partition.replicas.count|io.confluent.kafka.server.broker.topic.total.produce.requests.rate.1.min|io.confluent.kafka.server.controller.offline.partitions.count|io.confluent.kafka.server.socket.server.network.processor.avg.idle.percent|io.confluent.kafka.server.partition.under.replicated|io.confluent.kafka.server.log.log.start.offset|io.confluent.kafka.server.log.tier.size|io.confluent.kafka.server.log.size|io.confluent.kafka.server.tier.fetcher.bytes.fetched.total|io.confluent.kafka.server.request.total.time.ms.p50|io.confluent.kafka.server.tenant.consumer.lag.offsets|io.confluent.kafka.server.tenant.share.lag.offsets|io.confluent.kafka.server.log.log.end.offset|io.confluent.kafka.server.broker.topic.bytes.in.rate.1.min|io.confluent.kafka.server.partition.under.min.isr|io.confluent.kafka.server.partition.in.sync.replicas.count|io.confluent.telemetry.http.exporter.batches.dropped|io.confluent.telemetry.http.exporter.items.total|io.confluent.telemetry.http.exporter.items.succeeded|io.confluent.telemetry.http.exporter.send.time.total.millis|io.confluent.kafka.server.controller.leader.election.rate.(?!.*delta).*|io.confluent.telemetry.http.exporter.batches.failed|io.confluent.kafka.server.socket_server.connections|io.confluent.kafka.server.controller.fenced.broker.count|org.apache.kafka.consumer.(fetch.manager.fetch.latency.avg|connection.creation.total|fetch.manager.fetch.total|fetch.manager.bytes.consumed.rate|share.fetch.manager.fetch.latency.avg|share.fetch.manager.fetch.total|share.fetch.manager.bytes.consumed.rate)|org.apache.kafka.producer.(bufferpool.wait.ratio|record.queue.time.avg|request.latency.avg|produce.throttle.time.avg|connection.creation.total|request.total|topic.byte.rate)"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_BASE_URL: "http://prometheus:9090/api/v1/otlp"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_COMPRESSION: "gzip"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_KEY: "dummy"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_SECRET: "dummy"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_PENDING_BATCHES_MAX: "80"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_BATCH_ITEMS_MAX: "4000"
  KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_INFLIGHT_SUBMISSIONS_MAX: "10"
  KAFKA_CONFLUENT_TELEMETRY_METRICS_COLLECTOR_INTERVAL_MS: "60000"
  KAFKA_CONFLUENT_TELEMETRY_REMOTECONFIG_CONFLUENT_ENABLED: "false"
  KAFKA_CONFLUENT_CONSUMER_LAG_EMITTER_ENABLED: "true"

services:

  dc-a:
    image: confluentinc/cp-server:8.4.0
    hostname: dc-a
    container_name: dc-a
    ports:
      - "9092:9092"   # PLAINTEXT_HOST, for clients on the laptop
      - "8090:8090"   # Confluent Server embedded REST API v3 (/kafka/v3/...)
    environment:
      # --- KRaft, combined mode, single node ---
      CLUSTER_ID: "Q0PvpgzYSwirapvmRY0NFg"          # fixed so labs can hard-code it
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@dc-a:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://dc-a:29092,CONTROLLER://dc-a:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://dc-a:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # --- single-node replication factors ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # --- Cluster Linking (Confluent Server feature) ---
      KAFKA_CONFLUENT_CLUSTER_LINK_ENABLE: "true"
      KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: 1   # lab only; 3+ in production
      # --- Broker-side schema ID validation needs the broker to know its registry ---
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: "http://sr-a:8081"
      # --- Embedded REST API v3 (used for reverse-and-start / truncate-and-restore) ---
      KAFKA_CONFLUENT_HTTP_SERVER_LISTENERS: "http://0.0.0.0:8090"
      # --- keep the laptop quiet ---
      CONFLUENT_METRICS_ENABLE: "false"
      CONFLUENT_SUPPORT_CUSTOMER_ID: "anonymous"
      <<: *c3-telemetry        # metrics for Control Center (profile c3), see top of file
    volumes:
      - dc-a-data:/var/lib/kafka/data
      - ./work:/work           # lab files (link configs, filters, schemas) shared with the host
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server dc-a:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  sr-a:
    image: confluentinc/cp-schema-registry:8.4.0
    hostname: sr-a
    container_name: sr-a
    depends_on:
      dc-a:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "sr-a"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://dc-a:29092"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # Data contracts (rules) + Schema Linking (exporters). Both are Enterprise features.
      SCHEMA_REGISTRY_RESOURCE_EXTENSION_CLASS: "io.confluent.kafka.schemaregistry.rulehandler.RuleSetResourceExtension,io.confluent.schema.exporter.SchemaExporterResourceExtension"
      SCHEMA_REGISTRY_KAFKASTORE_UPDATE_HANDLERS: "io.confluent.schema.exporter.storage.SchemaExporterUpdateHandler"
      SCHEMA_REGISTRY_PASSWORD_ENCODER_SECRET: "crash-course-lab-only"   # must match on sr-a and sr-b
      SCHEMA_REGISTRY_MODE_MUTABILITY: "true"                            # allow IMPORT / READONLY modes
      SCHEMA_REGISTRY_CONFLUENT_LICENSE_REPLICATION_FACTOR: 1            # [untested] single-broker licence topic
    volumes:
      - ./work:/work

  dc-b:
    image: confluentinc/cp-server:8.4.0
    hostname: dc-b
    container_name: dc-b
    ports:
      - "9093:9093"
      - "8091:8090"
    environment:
      CLUSTER_ID: "UmwHWmvUR6KH9yIQ3xbmhg"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@dc-b:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://dc-b:29092,CONTROLLER://dc-b:29093,PLAINTEXT_HOST://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://dc-b:29092,PLAINTEXT_HOST://localhost:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_CLUSTER_LINK_ENABLE: "true"
      KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: "http://sr-b:8081"
      KAFKA_CONFLUENT_HTTP_SERVER_LISTENERS: "http://0.0.0.0:8090"
      CONFLUENT_METRICS_ENABLE: "false"
      CONFLUENT_SUPPORT_CUSTOMER_ID: "anonymous"
      <<: *c3-telemetry        # metrics for Control Center (profile c3), see top of file
    volumes:
      - dc-b-data:/var/lib/kafka/data
      - ./work:/work
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server dc-b:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  sr-b:
    image: confluentinc/cp-schema-registry:8.4.0
    hostname: sr-b
    container_name: sr-b
    depends_on:
      dc-b:
        condition: service_healthy
    ports:
      - "8082:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "sr-b"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://dc-b:29092"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_RESOURCE_EXTENSION_CLASS: "io.confluent.kafka.schemaregistry.rulehandler.RuleSetResourceExtension,io.confluent.schema.exporter.SchemaExporterResourceExtension"
      SCHEMA_REGISTRY_KAFKASTORE_UPDATE_HANDLERS: "io.confluent.schema.exporter.storage.SchemaExporterUpdateHandler"
      SCHEMA_REGISTRY_PASSWORD_ENCODER_SECRET: "crash-course-lab-only"
      SCHEMA_REGISTRY_MODE_MUTABILITY: "true"
      SCHEMA_REGISTRY_CONFLUENT_LICENSE_REPLICATION_FACTOR: 1
    volumes:
      - ./work:/work

  # Optional: Kafka Connect worker for the MirrorMaker 2 comparison (01-hybrid-multicloud lab).
  # MM2 connectors (MirrorSourceConnector, MirrorCheckpointConnector, MirrorHeartbeatConnector)
  # ship with Apache Kafka; the community cp-kafka-connect image should list them under
  # /connector-plugins (checked 2026-11-08). Runs "near the target": its own topics live on dc-b.
  connect:
    image: confluentinc/cp-kafka-connect:8.4.0
    hostname: connect
    container_name: connect
    profiles: ["mm2"]
    depends_on:
      dc-a:
        condition: service_healthy
      dc-b:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "dc-b:29092"
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: "connect"
      CONNECT_GROUP_ID: "mm2-dc-b"
      CONNECT_CONFIG_STORAGE_TOPIC: "_mm2-connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "_mm2-connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "_mm2-connect-status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # MM2 copies bytes; the worker converters must not touch them.
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.converters.ByteArrayConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.converters.ByteArrayConverter"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      # Let connectors override producer/consumer client settings (needed for target/source clients).
      CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: "All"
      # The image default is -Xmx2G; with both brokers running that got the worker OOM-killed in an
      # 8 GB Docker Desktop VM (2026-11-08). Three MM2 connectors with one task each fit in 768 MB.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    # The image's own healthcheck calls curl, which cp-kafka-connect:8.4.0 does not ship, so the
    # container stays "unhealthy" while Connect works fine. Same check (GET /connectors = 200)
    # with bash's /dev/tcp instead.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8083 && printf 'GET /connectors HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 12
    volumes:
      - ./work:/work

  # Optional: Control Center 2.x for visualisation (profile "c3"). Three containers, set up as in
  # confluentinc/cp-all-in-one 8.4.0-post. Home cluster is dc-b, because the labs stop dc-a for
  # failover and Control Center keeps its own topics on its home cluster. dc-a is added as a second
  # cluster. Config seeds in ./c3 (all six files are needed; Prometheus and Alertmanager exit
  # without the empty web-config-*.yml).
  prometheus:
    image: confluentinc/cp-enterprise-prometheus:2.7.0
    hostname: prometheus
    container_name: prometheus
    profiles: ["c3"]
    volumes:
      - ./c3:/mnt/config       # seed config in git; Control Center writes *-generated rule files here
    environment:
      CONFIG_PATH: "/mnt/config"
      SHOULD_LOG_TO_FILE: "false"
      LOG_FILE: "/dev/null"

  alertmanager:
    image: confluentinc/cp-enterprise-alertmanager:2.7.0
    hostname: alertmanager
    container_name: alertmanager
    profiles: ["c3"]
    depends_on:
      - prometheus
    volumes:
      - ./c3:/mnt/config
    # no host port: 9093 is dc-b's Kafka port on the host
    environment:
      CONFIG_PATH: "/mnt/config"
      SHOULD_LOG_TO_FILE: "false"
      LOG_FILE: "/dev/null"

  control-center:
    image: confluentinc/cp-enterprise-control-center-next-gen:2.7.0
    hostname: control-center
    container_name: control-center
    profiles: ["c3"]
    depends_on:
      dc-a:
        condition: service_healthy
      dc-b:
        condition: service_healthy
      prometheus:
        condition: service_started
      alertmanager:
        condition: service_started
    ports:
      - "9021:9021"
    volumes:
      - ./c3:/mnt/config
    environment:
      PORT: 9021
      CONTROL_CENTER_BOOTSTRAP_SERVERS: "dc-b:29092"            # home cluster; shown as "controlcenter.cluster" until renamed (README)
      CONTROL_CENTER_KAFKA_DC-A_BOOTSTRAP_SERVERS: "dc-a:29092" # second cluster
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://sr-b:8081"
      CONTROL_CENTER_CONNECT_MM2_CLUSTER: "http://connect:8083" # shown as down unless profile mm2 runs
      CONTROL_CENTER_CONNECT_HEALTHCHECK_ENDPOINT: "/connectors"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      CONTROL_CENTER_PROMETHEUS_ENABLE: "true"
      CONTROL_CENTER_PROMETHEUS_URL: "http://prometheus:9090"
      CONTROL_CENTER_PROMETHEUS_RULES_FILE: "/mnt/config/trigger_rules-generated.yml"
      CONTROL_CENTER_ALERTMANAGER_URL: "http://alertmanager:9093"
      CONTROL_CENTER_ALERTMANAGER_CONFIG_FILE: "/mnt/config/alertmanager-generated.yml"

volumes:
  dc-a-data:
  dc-b-data:
